backend:
  name: turbo-github
  turbo_site_id: 9c3037f1-149a-4d1e-8d25-edead631f424

media_folder: "uploads"
public_folder: "/uploads"

collections:
  # 1. Folder Collection: Blog Posts (with customizable styling!)
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Background Color", name: "bg_color", widget: "color", default: "#ffffff" }
      - { label: "Text Color", name: "text_color", widget: "color", default: "#000000" }
      - { label: "Font Choice", name: "font_family", widget: "select", options: ["Sans-Serif", "Serif", "Monospace"], default: "Sans-Serif" }
      - { label: "Body", name: "body", widget: "markdown" }

  # 2. File Collection: Pages (for editing existing words, titles, and layout styling!)
  - name: "pages"
    label: "Pages"
    delete: false
    files:
      - file: "content/about.md"
        label: "About Page"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Background Color", name: "bg_color", widget: "color", default: "#ffffff" }
          - { label: "Text Color", name: "text_color", widget: "color", default: "#000000" }
          - { label: "Font Choice", name: "font_family", widget: "select", options: ["Sans-Serif", "Serif", "Monospace"], default: "Sans-Serif" }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "content/contact.md"
        label: "Contact Page"
        name: "contact"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
