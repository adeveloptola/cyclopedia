backend:
  name: turbo-github
  turbo_site_id: 9c3037f1-149a-4d1e-8d25-edead631f424

media_folder: "uploads"
public_folder: "/uploads"

collections:
  # 1. Folder Collection (Generates new blog posts)
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }

  # 2. File Collection (Edits existing static pages!)
  - name: "pages"
    label: "Pages"
    delete: false # Safety setting to prevent deleting your page files
    files:
      - file: "content/about.md" # Change to the path of your about page file
        label: "About Page"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
